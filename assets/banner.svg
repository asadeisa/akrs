    <text class="s node" x="750" y="188" text-anchor="end" opacity="0">Router<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.05;.08;1" dur="9s" repeatCount="indefinite"/></text>
    <circle cx="846" cy="242" r="8" fill="#F5A524" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.09;.12;1" dur="9s" repeatCount="indefinite"/></circle>
    <text class="s node" x="828" y="234" text-anchor="end" opacity="0">Memory<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.09;.12;1" dur="9s" repeatCount="indefinite"/></text>
    <circle cx="950" cy="303" r="10" fill="#F5A524" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.14;.17;1" dur="9s" repeatCount="indefinite"/></circle>
    <text class="s node" x="932" y="295" text-anchor="end" opacity="0">Road<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.14;.17;1" dur="9s" repeatCount="indefinite"/></text>
  </g>

  <g fill="none" stroke="#F5A524" stroke-width="2" opacity="0.55" stroke-dasharray="300" stroke-dashoffset="300">
