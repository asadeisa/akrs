<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Left: without routing the agent opens eleven whole files to find the three the task needed, and its context window ends up nearly full. Right: routed through Router, Memory and Road, the same agent opens only the exact lines it needs across four files, and the context window stays barely filled.">
  <defs>
    <style>
      .s     { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .brand { font-size: 29px; font-weight: 700; fill: #E6EDF3; letter-spacing: -0.3px; }
      .tag   { font-size: 14.5px; fill: #7D8590; }
      .cap   { font-size: 17px; fill: #8B949E; }
      .capb  { font-size: 17px; fill: #E6EDF3; font-weight: 650; }
      .node  { font-size: 13px; fill: #F0C674; letter-spacing: .4px; }
      .leg   { font-size: 13.5px; fill: #7D8590; }
      .mtr   { font-size: 11.5px; letter-spacing: 1.8px; font-weight: 600; fill: #5E6672; }
    </style>
    <pattern id="cityA" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="19" height="19" rx="2.5" fill="#1B2534"/>
    </pattern>
    <pattern id="cityB" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="19" height="19" rx="2.5" fill="#141A23"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0B0F14"/>

  <text class="s brand" x="64" y="50">AKRS</text>
  <text class="s tag"   x="1216" y="38" text-anchor="end">Deliver the smallest correct knowledge,</text>
  <text class="s tag"   x="1216" y="60" text-anchor="end">to the correct agent, at the correct moment.</text>

