    <rect x="1056" y="117" width="118" height="12" rx="2"/><rect x="1056" y="135" width="118" height="12" rx="2"/><rect x="1056" y="153" width="118" height="12" rx="2"/><rect x="1056" y="171" width="118" height="12" rx="2"/>
    <rect x="1056" y="219" width="118" height="12" rx="2"/><rect x="1056" y="237" width="118" height="12" rx="2"/><rect x="1056" y="255" width="118" height="12" rx="2"/><rect x="1056" y="273" width="118" height="12" rx="2"/>
    <rect x="1056" y="321" width="118" height="12" rx="2"/><rect x="1056" y="339" width="118" height="12" rx="2"/><rect x="1056" y="357" width="118" height="12" rx="2"/><rect x="1056" y="375" width="118" height="12" rx="2"/>
