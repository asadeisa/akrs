    <path d="M950 303 C 995 303, 1000 252, 1040 252"><animate attributeName="stroke-dashoffset" values="300;300;0;0" keyTimes="0;.17;.235;1" dur="9s" repeatCount="indefinite"/></path>
    <path d="M950 303 C 995 303, 1000 354, 1040 354"><animate attributeName="stroke-dashoffset" values="300;300;0;0" keyTimes="0;.17;.235;1" dur="9s" repeatCount="indefinite"/></path>
    <path d="M950 303 C 995 303, 1000 456, 1040 456"><animate attributeName="stroke-dashoffset" values="300;300;0;0" keyTimes="0;.17;.235;1" dur="9s" repeatCount="indefinite"/></path>
  </g>

