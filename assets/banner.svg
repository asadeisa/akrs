    <rect x="218" y="410" width="19" height="19" rx="2.5" fill="#8C4B4B" opacity="0"><animate attributeName="opacity" values="0;0;.95;.95" keyTimes="0;.30;.34;1" dur="9s" repeatCount="indefinite"/></rect>
