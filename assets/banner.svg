    <rect x="162" y="242" width="19" height="19" rx="2.5" fill="#F5A524" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.18;.22;1" dur="9s" repeatCount="indefinite"/></rect>
