    <rect x="1040" y="106" width="150" height="88" rx="8"/>
    <rect x="1040" y="208" width="150" height="88" rx="8"/>
    <rect x="1040" y="310" width="150" height="88" rx="8"/>
    <rect x="1040" y="412" width="150" height="88" rx="8"/>
