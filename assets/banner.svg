        fill="none" stroke="#8C4B4B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="1900" stroke-dashoffset="1900" opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="1900;0;0" keyTimes="0;0.84;1" dur="9s" repeatCount="indefinite"/>
  </path>
  <circle r="7" fill="#D97070">
