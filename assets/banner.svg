      path="M116 140 H272 V250 H148 V376 H344 V196 H470 V330 H232 V448 H535"/>
  </circle>
  <circle cx="535" cy="447" r="16" fill="none" stroke="#F5A524" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="12;30;30" keyTimes="0;.90;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;.7;0;0" keyTimes="0;.84;.86;.92;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <text class="s mtr" x="78" y="516">CONTEXT WINDOW</text>
  <rect x="78" y="524" width="524" height="26" rx="6" fill="#10161F" stroke="#243040" stroke-width="1"/>
  <g>
    <rect x="82"  y="527" width="44" height="20" rx="2" fill="#8C4B4B" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.06;.10;1" dur="9s" repeatCount="indefinite"/></rect>
    <rect x="129" y="527" width="44" height="20" rx="2" fill="#8C4B4B" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.12;.16;1" dur="9s" repeatCount="indefinite"/></rect>
