  <text class="s cap"  x="340" y="584" text-anchor="middle">eleven whole files to find the three that mattered</text>
  <text class="s capb" x="940" y="584" text-anchor="middle">the same three — opened at the lines that mattered</text>

  <g>
    <rect x="407" y="603" width="15" height="11" rx="2" fill="#F5A524"/>
    <text class="s leg" x="430" y="613">what the task needed</text>
