  </circle>

  <text class="s mtr" x="678" y="516">CONTEXT WINDOW</text>
  <rect x="678" y="524" width="524" height="26" rx="6" fill="#10161F" stroke="#243040" stroke-width="1"/>
  <g>
    <rect x="682" y="527" width="10" height="20" rx="2" fill="#F5A524" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.24;.28;1" dur="9s" repeatCount="indefinite"/></rect>
