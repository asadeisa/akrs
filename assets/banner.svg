  </g>

  <!-- ==================== RIGHT ==================== -->
  <rect x="664" y="88" width="552" height="468" rx="14" fill="#0E141C" stroke="#1C2430" stroke-width="1"/>
  <rect x="678" y="102" width="524" height="392" fill="url(#cityB)"/>

  <path d="M690 150 L950 303" fill="none" stroke="#F5A524" stroke-width="14" stroke-linecap="round"
        opacity="0.16" filter="url(#soft)" stroke-dasharray="320" stroke-dashoffset="320">
    <animate attributeName="stroke-dashoffset" values="320;0;0" keyTimes="0;.17;1" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M690 150 L950 303" fill="none" stroke="#F5A524" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="320" stroke-dashoffset="320">
    <animate attributeName="stroke-dashoffset" values="320;0;0" keyTimes="0;.17;1" dur="9s" repeatCount="indefinite"/>
  </path>

  <g>
